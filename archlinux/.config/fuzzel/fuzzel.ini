
# Fuzzel - Catppuccin Mocha
# Accent: Mauve

[main]
font=JetBrainsMono Nerd Font:size=12
icon-theme=Papirus-Dark
icons-enabled=yes

# Layout
width=40
lines=8
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=24

# Appearance
prompt="❯ "
layer=overlay
# 字体尺寸按照Wayland输出缩放倍率计算
dpi-aware=no

[colors]
# Mocha Base
background=1e1e2ef2

# Text
text=cdd6f4ff
prompt=cba6f7ff
placeholder=6c7086ff
input=cdd6f4ff
match=cba6f7ff

# Selected item
selection=45475aff
selection-text=cdd6f4ff
selection-match=cba6f7ff

# Additional
counter=a6adc8ff
border=cba6f7ff

[border]
width=2
radius=12
selection-radius=8

